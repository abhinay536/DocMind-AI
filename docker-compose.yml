services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: docmind-db
    environment:
      POSTGRES_USER: docmind_user
      POSTGRES_PASSWORD: docmind_secure_password
      POSTGRES_DB: docmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind_user -d docmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: docmind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docmind-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://docmind_user:docmind_secure_password@db:5432/docmind_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - TESSERACT_PATH=/usr/bin/tesseract
      - SECRET_KEY=docmind-production-super-secret-jwt-key-2026
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./data/uploads:/app/data/uploads

  # React Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: docmind-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
