services:
  # 1. FastAPI Backend Service
  - type: web
    name: docmind-backend
    env: python
    buildCommand: "pip install --default-timeout=1000 --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu torch && pip install --no-cache-dir -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docmind-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # 2. React Frontend Service
  - type: web
    name: docmind-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

databases:
  # 3. Managed PostgreSQL Database
  - name: docmind-postgres
    databaseName: docmind_db
    user: docmind_user

