services:
  # 1. FastAPI Backend Web Service (Docker Container)
  - type: web
    name: docmind-backend
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docmind-postgres
          property: connectionString
      - key: QDRANT_HOST
        value: localhost
      - key: QDRANT_PORT
        value: "6333"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # 2. React Frontend Static Site
  - type: web
    name: docmind-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: docmind-backend
          property: url

databases:
  # 3. PostgreSQL Managed Database
  - name: docmind-postgres
    databaseName: docmind_db
    user: docmind_user
    plan: free

